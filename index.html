<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chapters 11 and 12 Practice Test: Fiscal Policy, Deficits and Debt</title>
  <meta name="description" content="Practice test for Macroeconomics chapters 11 and 12 with instant grading and explanations.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="title-block">
        <p class="course">Macroeconomics practice test</p>
        <h1>Chapters 11 and 12: Fiscal Policy, Deficits and Debt</h1>
      </div>
      <div class="controls">
        <label class="select-label" for="filter">Questions</label>
        <select id="filter">
          <option value="all">Both chapters</option>
          <option value="11">Chapter 11 only</option>
          <option value="12">Chapter 12 only</option>
        </select>
        <label class="check-label"><input type="checkbox" id="shuffle"> Shuffle order</label>
        <button type="button" class="btn btn-quiet" id="restart">Start over</button>
      </div>
    </div>
    <div class="ledger" aria-label="Score progress">
      <div class="ledger-bar" id="ledgerBar" role="img" aria-label="">
        <span class="seg seg-correct" id="segCorrect"></span>
        <span class="seg seg-missed" id="segMissed"></span>
      </div>
      <p class="ledger-text" id="ledgerText" aria-live="polite"></p>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-live="polite"></section>

    <aside class="map" aria-label="Question map">
      <h2 class="map-title">Question map</h2>
      <ol class="map-grid" id="mapGrid"></ol>
      <ul class="map-key">
        <li><span class="key key-correct"></span>Correct</li>
        <li><span class="key key-missed"></span>Missed</li>
        <li><span class="key key-open"></span>Not answered</li>
      </ul>
      <button type="button" class="btn btn-quiet btn-wide" id="finish">See results</button>
    </aside>
  </main>

  <footer class="foot">
    <p>Based on Schiller, <em>The Macro Economy Today</em>, chapters 11 and 12 notes. Keyboard: number or letter keys pick an answer, Enter checks or moves on.</p>
  </footer>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
